# bye_emails configuration

llm:
  provider: anthropic
  model: claude-haiku-5-5                # extracts codes, trips, and briefs
  summarize_model: claude-haiku-5-5      # newsletter summaries
  api_key_env: ANTHROPIC_API_KEY

# Jev picks which rule matches. It does not write the brief or the code.
jev:
  model: jev-latest
  api_key_env: TYPESAFE_API_KEY

accounts:
  - name: personal
    host: imap.gmail.com
    port: 993
    secure: true
    auth:
      user_env: GMAIL_USER
      pass_env: GMAIL_APP_PASSWORD
    mailbox: INBOX
    processed_label: bye_emails/processed
    poll_interval: 30  # fallback polling interval in seconds

  - name: cldstart
    host: imap.gmail.com
    port: 993
    secure: true
    auth:
      user_env: CLDSTART_GMAIL_USER
      pass_env: CLDSTART_GMAIL_APP_PASSWORD
    mailbox: INBOX
    processed_label: bye_emails/processed
    poll_interval: 30  # fallback polling interval in seconds

channels:
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

rules:
  # Linear sender addresses (@linear.app) are archived silently after triage,
  # with no Telegram message. Security emails (login codes) still notify.
  - name: github
    description: >
      Emails sent by GitHub, including repository activity, pull requests,
      issues, Actions, Dependabot, and account notifications. GitHub sender
      addresses are matched before LLM triage so these always auto-archive.
    action: notify_and_archive
    notify_template: short

  - name: netdata_alert
    description: >
      Automated Netdata monitoring alerts and recovery notices, including
      health alarms, anomaly detections, threshold alerts, and resolved alerts.
      These are status notifications from Netdata and should be filed after a
      brief notification, even when the alert reports a problem.
    action: notify_and_archive
    notify_template: short

  - name: app_store_submission_status
    description: >
      Automated Apple App Store Connect or Apple Developer notices about an
      app submission, build, version, or TestFlight review status. This
      includes accepted, rejected, metadata-rejected, waiting-for-review,
      in-review, approved, ready-for-sale, released, processing, and similar
      submission-state changes. Do not use this for Apple account security,
      billing, legal, or team-management messages.
    action: notify_and_archive
    notify_template: short

  - name: play_store_submission_status
    description: >
      Automated Google Play Console or Google Play Developer notices about an
      app or release submission, review, publishing, rollout, or availability
      status. This includes accepted, rejected, under-review, changes-sent-for-
      review, published, live, halted, processing, and similar release-state
      changes. Do not use this for Google account security, billing, policy,
      legal, or developer-account administration messages.
    action: notify_and_archive
    notify_template: short

  - name: spam-like
    description: >
      Marketing emails, promotional offers, social media notifications,
      automated notifications that don't require action. Things like
      "someone liked your post", store promotions, app notifications, etc.
    action: notify_and_archive
    notify_template: short

  - name: receipts
    description: >
      Receipts, invoices, billing statements, e-receipts, payment
      confirmations, subscription receipts, vendor invoices, SaaS receipts,
      and bookkeeping copies that only need to be filed. If the message says
      payment failed, action is required, a payment method must be updated,
      a bill is overdue, or service may be interrupted, classify it as
      needs_attention instead.
    action: notify_and_archive
    notify_template: short

  - name: newsletters
    description: >
      Newsletters I'm subscribed to, especially financial newsletters.
      Investment analysis, market commentary, stock picks, research reports.
    action: summarize_and_archive
    notify_template: summary

  - name: security
    description: >
      OTP codes, login verification, 2FA codes, password reset links,
      security alerts, login notifications from services.
    action: extract_and_archive
    notify_template: security

  - name: travel
    description: >
      Flight confirmations, hotel reservations, train tickets,
      car rentals, travel itineraries, booking modifications.
    action: calendar_and_archive
    notify_template: travel

  - name: needs_attention
    description: >
      Emails from real people that need a response, important
      business emails, anything requiring my direct action or review.
    action: notify_keep
    notify_template: full

plugins:
  calendar:
    provider: icloud
    server_url: https://caldav.icloud.com
    auth_method: Basic
    credentials:
      username: CALDAV_USERNAME
      password: CALDAV_PASSWORD
    calendar_name: Travel

    # Google Calendar example:
    # provider: google
    # server_url: https://apidata.googleusercontent.com/caldav/v2/
    # auth_method: Oauth
    # credentials:
    #   tokenUrl: GOOGLE_TOKEN_URL
